<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="T">
  <!-- Drawn as rectangles rather than <text>: a favicon must not depend on a
       font being available, and a letterform this simple costs nothing to draw.
       Colours are the site tokens: ground #0b0c0e, accent #6ee7a8. -->
  <rect width="32" height="32" rx="6" fill="#0b0c0e" />
  <rect x="7" y="9" width="18" height="3.6" fill="#6ee7a8" />
  <rect x="14.2" y="9" width="3.6" height="14" fill="#6ee7a8" />
</svg>
